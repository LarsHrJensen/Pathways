<div class="hero">

  <div class="hero-text">
    <h1>Pathways</h1>

    <h2>Music discovery and visualization platform</h2>

      Broaden your musical horizons by making landscapes of your playlists.
    
  </div>

  <div class="search-container">

    <app-search
      (resultSelected)="onResultSelected($event)">
    </app-search>

  </div>

  <div class="upload-container">
    
    <app-upload></app-upload>
    <a routerLink="/playlist">View your playlist</a>

  </div>

</div>

<app-graph
  [selectedResult]="selectedResult">
</app-graph>
