<div class="search-container">
    <input
      type="search"
      [(ngModel)]="searchTerm"
      (ngModelChange)="search($event)"
      placeholder="Search artists, bands, producers, album, etc...">

    <div class="search-results">
      @for (artist of searchResults; track artist.id) {
        <p (click)="selectResult(artist)">
          {{ artist.name }} - {{ artist.type }}
        </p>
      }
    </div>
</div>
